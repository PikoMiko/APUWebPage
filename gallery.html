<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - APU Sports</title>
    <link href="css/design.css" rel="stylesheet"/>
    <link href="css/format.css" rel="stylesheet"/>    
</head>
<body>
    <h1 class="select-role">Gallery</h1>
    
    <div class="gallery-ed">
        <h2 class="event-title">1st Edition</h2>
        <img class="large-img" src="elements/multimedia/Images/gallery-1.jpg" alt="color run">
        <em class="caption">International Colour Run as Opening Event</em>
        <br/>
        <img class="std-img" src="elements/multimedia/Images/gallery-2.webp">
        <img class="std-img" src="elements/multimedia/Images/gallery-3.JPG">
        <img class="std-img" src="elements/multimedia/Images/gallery-4.jpg">
    </div>
    <h2 class="event-title">Videos</h1>
    <div class="gallery-vid">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/jqHdY6vXVFU?si=GzznCsnVzE9sxF5N" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <script src="javascript/script.js"></script>
