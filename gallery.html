<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - APU Sports</title>
    <link href="css/design.css" rel="stylesheet"/>
    <link href="css/format.css" rel="stylesheet"/>    
</head>
<body>
    <main>
        <h1 class="select-role">Gallery</h1>
        
        <div class="gallery-ed">
            <h2>4th Edition</h2>
            <img class="large-img" src="elements/multimedia/Images/gallery-1.jpg" alt="color run">
            <br/><em class="caption">International Colour Run as Opening Event</em><br/>

            <h2>Tournament Events</h2>
            <div class="img-row">
                <div class="img-container">
                    <img class="std-img" src="elements/multimedia/Images/gallery-2.webp">
                    <div class="hover-caption">Football tournament</div>
                </div>
                <div class="img-container">
                    <img class="std-img" src="elements/multimedia/Images/gallery-3.JPG">
                    <div class="hover-caption">Basketball tournament</div>
                </div>
                <div class="img-container">
                    <img class="std-img" src="elements/multimedia/Images/gallery-4.jpg">
                    <div class="hover-caption">Swimming race</div>
                </div>
            </div>

            <h2>Videos</h2>
            <div class="gallery-vid">
                <iframe width="1280" height="720" src="https://www.youtube.com/embed/jqHdY6vXVFU?si=GzznCsnVzE9sxF5N" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
    </main>
    <script src="javascript/script.js"></script>
</body>
</html>
