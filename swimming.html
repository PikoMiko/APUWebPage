<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Swimming</title>
    <link href="css/design.css" rel="stylesheet"/>
    <link href="css/format.css" rel="stylesheet"/>
    <link href="css/leaderboard.css" rel="stylesheet"/>
</head>
<body>
    <div class="card">
        <div class="labels">
            <div class="label-top">
                <div class="racetitle">
                    <p class="minititle">APU SPORTS DAY 2026</p>
                    <h1 class="resultstitle">Race Results</h1>
                </div>
                <div class="rounds">
                    <button id="btn-fs50" onclick="switchTab('fs50')">50m Freestyle</button>
                    <button id="btn-fs100" onclick="switchTab('fs100')">100m Freestyle</button>
                    <button id="btn-bs50" onclick="switchTab('bs50')">50m Backstroke</button>
                    <button id="btn-bs100" onclick="switchTab('bs100')">100m Backstroke</button>
                    <button id="btn-totalpts" onclick="switchTab('totalpts')">Team Points</button>
                </div> 
            </div> <!-- end of label top--> 
        </div>
        <div id="renderboard"></div>
    </div> <!-- end of card-->
<script src="javascript/results.js"></script>
<script src="javascript/script.js"></script>
</body>
</html>
