<!DOCTYPE html>
<html>
<head>
    <title>Information - APU Sports</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="design.css" rel="stylesheet"/>
    <link href="format.css" rel="stylesheet"/>
</head>
<body>
    <div class="info-container">
        <h1 class="page-title">Information</h1>
        <p>Welcome to the APU Sports Championship! Here you can find all the information.</p>
    </div>
    <div class="sports-menu">
        <img src="elements/multimedia/Images/swimming.jpg" alt="Swimming" class="sports-image">
        <span class="sports-text">Swimming</span>
        <div class="info-btn">
            <img src="elements/multimedia/symbols/arrow_forward.png" alt="Info Button" class="info-icon"/>
        </div>
    </div>
    <div class="sports-menu">
        <img src="elements/multimedia/Images/football.jpg" alt="Football" class="sports-image">
        <span class="sports-text">Football</span>
        <div class="info-btn">
             <img src="elements/multimedia/symbols/arrow_forward.png" alt="Info Button" class="info-icon"/>
        </div>
    </div>
    <div class="sports-menu">
        <img src="elements/multimedia/Images/basketball.jpg" alt="Basketball" class="sports-image">
        <span class="sports-text">Basketball</span>
        <div class="info-btn">
             <img src="elements/multimedia/symbols/arrow_forward.png" alt="Info Button" class="info-icon"/>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
