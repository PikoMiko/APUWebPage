<!DOCTYPE html>
<html>
<head>
    <title>Feedback - APU Sports</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/design.css" rel="stylesheet"/>
    <link href="css/format.css" rel="stylesheet"/>    
</head>
<body>
    <div style="padding: 40px; max-width: 700px; margin: 0 auto;">
        <h1 style="font-family: 'GothicHead', sans-serif; color: rgb(117, 11, 11);">Event Feedback</h1>
        <p>We value your opinion! Please share your experience with us.</p>

        <form id="feedbackForm" style="margin-top: 20px;">
            <label><b>Your Name:</b></label><br/>
            <input type="text" id="feedbackName" placeholder="Enter your name" required/><br/><br/>

            <label><b>Rate the Event:</b></label><br/>
            <select id="feedbackRating" required>
                <option value="">-- Select --</option>
                <option value="Excellent">Excellent</option>
                <option value="Good">Good</option>
                <option value="Average">Average</option>
                <option value="Poor">Poor</option>
            </select><br/><br/>

            <label><b>Your Comments:</b></label><br/>
            <textarea id="feedbackComments" rows="5" style="width: 100%; border: 2px solid gold; border-radius: 4px; background-color: black; color: white; padding: 5px;" required></textarea><br/><br/>

            <button type="button" onclick="validateFeedbackForm()" style="padding: 10px 20px; background-color: rgb(117, 11, 11); color: white; border: none; cursor: pointer;">Submit Feedback</button>
        </form>
    </div>

    <script src="javascript/script.js"></script>
</body>
</html>
