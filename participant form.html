<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="design.css" rel="stylesheet"/>
    <link href="format.css" rel="stylesheet"/>
    <title>Register - Team</title>
</head>
    <body id="participant-form">
        <div class="regis">
            <form method="get" id="playerinfo">
                <div id="players"></div>
            </form>

            <form method="get" id="teaminfo">
                <select class="notname" name="events">
                    <option value="placeholder">-- Select Event --</option>
                    <option value="Event1">Swimming</option>
                    <option value="Event2">Basketball</option>
                    <option value="Event3">Football</option>
                </select> <br/><br/>
                <input type="text" class="notname" name="team" placeholder="Team Name" required/><br/><br/>
                <label><b>Team Logo</b></label><br/>
                <input type="file" id="fileInput" name="teamLogo" accept="image/jpg/png/webp" required/>
                <div class="imgpreview"><img id="preview" src="" alt="Team Logo"></div>
            </form>
        </div>
        <br/><br/>
        <button type="submit" class="submit-btn">
          Submit
        </button>
        <script src="javascript/script.js"></script>
    </body>
</html>
