<!DOCTYPE html>
<html>
<head>
    <title>Sponsors & Partners - APU Sports</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/design.css" rel="stylesheet"/>
    <link href="css/format.css" rel="stylesheet"/>

    <!-- CSS -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        .sponsor-container {
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .page-title {
            font-family: 'GothicHead', sans-serif;
            color: rgb(117, 11, 11);
            margin-bottom: 20px;
        }

        .sponsor-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin-top: 30px;
        }

        .sponsor-card {
            border: 2px solid gold;
            border-radius: 8px;
            padding: 20px;
            width: 250px;
            background-color: #f9f9f9;
        }

        .sponsor-logo {
            width: 200px;
            height: auto;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="sponsor-container">
        <h1 class="page-title">Sponsors & Partners</h1>
        <p>We are proud to be supported by our amazing sponsors and partners who make the APU Sports Championship possible.</p>

        <div class="sponsor-grid">
            <div class="sponsor-card">
                <img src="elements/multimedia/Images/nike-logo.png" alt="Nike Logo" class="sponsor-logo">
                <h3>Nike</h3>
                <p>Official sportswear sponsor providing gear for athletes.</p>
            </div>

            <div class="sponsor-card">
                <img src="elements/multimedia/Images/gatorade-logo.png" alt="Gatorade Logo" class="sponsor-logo">
                <h3>Gatorade</h3>
                <p>Hydration partner keeping participants energized.</p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="javascript/script.js"></script>
    <script>
        
        const cards = document.querySelectorAll('.sponsor-card');
        cards.forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.backgroundColor = '#fff3cd'; 
            });
            card.addEventListener('mouseleave', () => {
                card.style.backgroundColor = '#f9f9f9';
            });
        });
    </script>
</body>
</html>
