<!DOCTYPE html>
<html>
<head>
    <title>Contact Us - APU Sports</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="design.css" rel="stylesheet"/>
    <link href="format.css" rel="stylesheet"/>    
</head>
<body>
    <div style="padding: 40px; max-width: 600px; margin: 0 auto; text-align: center;">
        <h1 style="font-family: 'GothicHead', sans-serif; color: rgb(117, 11, 11);">Contact Us</h1>
        <p>Have any questions? Send us a message!</p>

        <form id="contactForm" style="text-align: left; margin-top: 20px;">
            <label><b>Your Name:</b></label><br/>
            <input type="text" id="contactName" placeholder="Enter your name" required/><br/><br/>

            <label><b>Your Message:</b></label><br/>
            <textarea id="contactMessage" rows="5" style="width: 100%; border: 2px solid gold; border-radius: 4px; background-color: black; color: white; padding: 5px;" required></textarea><br/><br/>

            <button type="button" onclick="validateContactForm()" style="padding: 10px 20px; background-color: rgb(117, 11, 11); color: white; border: none; cursor: pointer;">Send Message</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
